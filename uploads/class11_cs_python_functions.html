<!DOCTYPE html><html><head><style>body { background:#0f172a; color:#f8fafc; font-family:system-ui; padding:2rem; } h1 { color:#38bdf8; } pre { background:#1e293b; padding:1rem; border-radius:8px; color:#4ade80; }</style></head><body><h1>Class 11 CS - Python Functions & Scope</h1><p>Functions allow code reusability. Parameters can be positional, default, or keyword arguments.</p><h3>Scope Example:</h3><pre>x = 100 # Global variable
def update():
    global x
    x = 200 # Mutates global x
update()
print(x) # Output: 200</pre></body></html>
